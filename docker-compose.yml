services:
  db:
    image: postgres:16-alpine
    container_name: gym_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: base
    container_name: gym_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"

  notifier:
    build: ./notifier
    container_name: gym_notifier
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: gym_proxy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Descomentar cuando exista el build del frontend Angular:
      # - ./frontend/dist/gym-frontend/browser:/usr/share/nginx/html:ro

  # Suite de tests. No arranca con "docker compose up" (esta bajo un profile).
  # Ejecutar con:  docker compose run --rm tests
  tests:
    build:
      context: ./backend
      target: dev
    profiles: ["test"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-v"]

volumes:
  pgdata:
