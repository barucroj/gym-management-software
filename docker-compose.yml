services:
  db:
    image: postgres:16-alpine
    container_name: gym_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    image: gym-management/api:local
    container_name: gym_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  notifier:
    build:
      context: .
      dockerfile: notifier/Dockerfile
    container_name: gym_notifier
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: gym_proxy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Descomentar cuando exista el build del frontend Angular:
      # - ./frontend/dist/gym-frontend/browser:/usr/share/nginx/html:ro

  # Migraciones de base de datos (Alembic). Bajo profile: no arranca con "up".
  #   docker compose run --rm migrate                     -> aplica pendientes
  #   docker compose run --rm migrate alembic -c gym_core/alembic.ini history
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    image: gym-management/api:local
    profiles: ["tools"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "-c", "gym_core/alembic.ini", "upgrade", "head"]

  # Suite de tests. Bajo profile: no arranca con "docker compose up".
  #   docker compose run --rm tests
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: gym-management/tests:local
    profiles: ["test"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-v"]

volumes:
  pgdata:
