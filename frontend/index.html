<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-activity"></i> Gym Software</a>
      <div class="d-none align-items-center gap-3" id="barra-usuario">
        <span class="text-white-50 small" id="etiqueta-usuario"></span>
        <button class="btn btn-outline-light btn-sm" id="btn-salir">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <!-- PANTALLA DE LOGIN: lo unico visible mientras no haya sesion -->
  <div class="container" id="pantalla-login" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">Iniciar sesión</h4>
        <form id="form-login">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="login-email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="login-password" class="form-control" required>
          </div>
          <div class="alert alert-danger d-none py-2" id="login-error"></div>
          <button type="submit" class="btn btn-primary w-100" id="btn-entrar">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <div class="container d-none" id="pantalla-app">
    <ul class="nav nav-pills mb-3" id="mainTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="miembros-tab" data-bs-toggle="tab" data-bs-target="#miembros" type="button" onclick="cargarMiembros()">Miembros</button>
      </li>
      <li class="nav-item d-none" id="item-usuarios">
        <button class="nav-link" id="usuarios-tab" data-bs-toggle="tab" data-bs-target="#usuarios" type="button" onclick="cargarUsuarios()">Usuarios</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="planes-tab" data-bs-toggle="tab" data-bs-target="#planes" type="button" onclick="cargarPlanes()">Planes</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- TAB MIEMBROS -->
      <div class="tab-pane fade show active" id="miembros">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Gestión de Miembros</h3>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalMiembro"><i class="bi bi-plus-lg"></i> Nuevo Miembro</button>
        </div>
        <table class="table table-striped table-hover shadow-sm bg-white rounded">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-miembros"></tbody>
        </table>
      </div>

      <!-- TAB USUARIOS -->
      <div class="tab-pane fade" id="usuarios">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Usuarios del Sistema</h3>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"><i class="bi bi-plus-lg"></i> Nuevo Usuario</button>
        </div>
        <table class="table table-striped table-hover shadow-sm bg-white rounded">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios"></tbody>
        </table>
      </div>

      <!-- TAB PLANES -->
      <div class="tab-pane fade" id="planes">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Planes de Membresía</h3>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalPlan"><i class="bi bi-plus-lg"></i> Nuevo Plan</button>
        </div>
        <table class="table table-striped table-hover shadow-sm bg-white rounded">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Duración (Días)</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-planes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL NUEVO MIEMBRO -->
  <div class="modal fade" id="modalMiembro" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Miembro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-miembro">
            <div class="row">
              <div class="col mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" id="m-nombre" class="form-control" required>
              </div>
              <!-- apellidos es obligatorio en el modelo: sin este campo el
                   alta fallaba con 422 y el formulario no daba pista alguna. -->
              <div class="col mb-3">
                <label class="form-label">Apellidos</label>
                <input type="text" id="m-apellidos" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="m-email" class="form-control">
            </div>
            <div class="row">
              <div class="col mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" id="m-telefono" class="form-control">
              </div>
              <div class="col mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" id="m-nacimiento" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Notas</label>
              <textarea id="m-notas" class="form-control" rows="2"></textarea>
            </div>
            <div class="alert alert-danger d-none py-2" id="m-error"></div>
            <button type="submit" class="btn btn-primary w-100">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL NUEVO USUARIO -->
  <div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-usuario">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" id="u-nombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="u-email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <!-- minlength espeja la restriccion del schema del API -->
              <input type="password" id="u-password" class="form-control" minlength="8" required>
              <div class="form-text">Mínimo 8 caracteres.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Rol</label>
              <select id="u-rol" class="form-select">
                <option value="recepcion" selected>Recepción</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <div class="alert alert-danger d-none py-2" id="u-error"></div>
            <button type="submit" class="btn btn-primary w-100">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL NUEVO PLAN -->
  <div class="modal fade" id="modalPlan" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Plan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-plan">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" id="p-nombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea id="p-descripcion" class="form-control" rows="2"></textarea>
            </div>
            <div class="row">
              <div class="col mb-3">
                <label class="form-label">Duración (días)</label>
                <input type="number" id="p-duracion" class="form-control" min="1" required>
              </div>
              <div class="col mb-3">
                <label class="form-label">Precio</label>
                <input type="number" id="p-precio" class="form-control" min="0" step="0.01" required>
              </div>
            </div>
            <div class="alert alert-danger d-none py-2" id="p-error"></div>
            <button type="submit" class="btn btn-primary w-100">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
