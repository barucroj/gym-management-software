[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-core"
version = "0.1.0"
description = "Modelos y acceso a datos compartidos entre el API y el notifier."
requires-python = ">=3.12"
dependencies = [
    "sqlmodel==0.0.22",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "alembic==1.14.0",
]

[tool.setuptools.packages.find]
include = ["gym_core*"]
