# Nginx: unico punto de entrada del sistema.
# - /api/  -> backend FastAPI
# - /      -> frontend Angular (build estatico, se habilita cuando exista)

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # DNS embebido de Docker.
    #
    # Sin resolver, nginx resuelve el hostname "api" una unica vez al arrancar
    # y cachea esa IP para siempre: al recrear el contenedor del API (cualquier
    # "docker compose up --build") la IP cambia y el proxy responde 502 hasta
    # que se le reinicia a mano. Con resolver + la variable $api_backend,
    # la resolucion ocurre por peticion y se revalida cada 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_backend "api:8000";

    # --- API ---
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Documentacion de la API ---
    location /docs {
        proxy_pass       http://$api_backend$request_uri;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://$api_backend$request_uri;
        proxy_set_header Host $host;
    }

    # --- Frontend Angular ---
    # Se habilita cuando el frontend exista y su build se monte en /usr/share/nginx/html.
    # location / {
    #     root      /usr/share/nginx/html;
    #     index     index.html;
    #     try_files $uri $uri/ /index.html;
    # }
}
