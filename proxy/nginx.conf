# Nginx: unico punto de entrada del sistema.
#
#   /                 -> frontend estatico
#   /api/...          -> backend FastAPI, con la ruta intacta
#   /docs, /openapi.json, /health -> backend
#
# Al salir todo por el mismo origen, el navegador nunca cruza de dominio y
# no hace falta CORS.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # DNS embebido de Docker.
    #
    # Sin resolver, nginx resuelve el hostname "api" una unica vez al arrancar
    # y cachea esa IP para siempre: al recrear el contenedor del API (cualquier
    # "docker compose up --build") la IP cambia y el proxy responde 502 hasta
    # que se le reinicia a mano. Con resolver + la variable $api_backend,
    # la resolucion ocurre por peticion y se revalida cada 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_backend "api:8000";

    # Cabeceras comunes a todo lo que se reenvia al API: sin ellas el API
    # ve siempre la IP del contenedor de nginx en lugar de la del cliente.
    # Se declaran aqui, a nivel de server, y las heredan todos los location.
    # Ojo: si algun location declarara un proxy_set_header propio, perderia
    # todos estos y habria que repetirlos.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # --- API ---
    #
    # Sin rewrite, a proposito. Los routers estan montados en /api/v1/..., asi
    # que la ruta ya trae el prefijo: recortarlo aqui haria que /api/v1/miembros
    # llegara al API como /v1/miembros y respondiera 404.
    #
    # Ademas, si el proxy tradujera rutas, el mismo recurso tendria dos
    # direcciones distintas segun por donde se entre, y el esquema que el API
    # publica en /openapi.json solo describiria una de las dos.
    location /api/ {
        proxy_pass http://$api_backend;
    }

    # --- Salud ---
    # Util para comprobar el sistema desde fuera sin exponer el puerto del API.
    location /health {
        proxy_pass http://$api_backend$request_uri;
    }

    # --- Documentacion de la API ---
    location /docs {
        proxy_pass http://$api_backend$request_uri;
    }

    location /openapi.json {
        proxy_pass http://$api_backend$request_uri;
    }

    # --- Frontend ---
    # Archivos estaticos servidos directamente por nginx. try_files devuelve
    # index.html cuando la ruta no es un archivo, para que las rutas del
    # frontend funcionen al recargar la pagina.
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
