# Nginx: único punto de entrada del sistema.
# - /api/  -> backend FastAPI
# - /      -> frontend Angular (build estático, se habilita cuando exista)

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # --- API ---
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Documentación de la API ---
    location /docs {
        proxy_pass       http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass       http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # --- Frontend Angular ---
    # Se habilita cuando el frontend exista y su build se monte en /usr/share/nginx/html.
    # location / {
    #     root      /usr/share/nginx/html;
    #     index     index.html;
    #     try_files $uri $uri/ /index.html;
    # }
}
